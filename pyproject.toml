[project]
name = "retail-order-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ToniToledoMonleon", email = "toni.toledo.avanzaprl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
prueba-sopra = "retail_order_api:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
